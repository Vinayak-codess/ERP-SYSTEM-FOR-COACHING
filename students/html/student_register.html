<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>

<body>
    <div class="main">
        <div class="top-nav">
            <a href="/public/index.html" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Home</span>
            </a>
        </div>
        <h3 id="register_heading">Student Registration</h3>
        <form action="#" class="form">
            <div class="cred">
                <input type="text" name="name" id="name" placeholder="Full Name" required>
                <input type="tel" name="phone" id="phone" placeholder="Phone No.">
                <input type="email" name="email" id="email" placeholder="Email">
                <input type="password" name="password" id="password" placeholder="Password">
                <div class="select">
                    <select name="course_id" id="course_id">
                        <option value="" disabled selected>Select Course</option>
                        <option value="1">JEE</option>
                        <option value="2">NEET</option>
                        <option value="3">Foundation</option>
                    </select>
                    <select name="batch_id" id="batch_id">
                        <option value="" disabled selected>Select Batch</option>
                        <option value="1">Batch A</option>
                        <option value="2">Batch B</option>
                    </select>
                </div>
                <input type="date" id="admission_date" name="admission_date">
            </div>
            <button id="register_btn_register">Register</button>
            <a id="login_link_from_register" href="/public/login.html">Already have an account? Login</a>
        </form>
    </div>
</body>
<script type="module" src="../js/student_register.js"></script>

</html>
