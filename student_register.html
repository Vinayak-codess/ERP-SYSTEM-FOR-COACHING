<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h2 id="main_heading">Coaching Institute ERP</h2> 
        <h3 id="register_heading">Student Registration</h3>
            <form action="#" class="form">
                <div class="cred">
                    <input type="tel" name="phone" id="phone" placeholder="Phone No."><br>
                    <input type="email" name="email" id="email" placeholder="Email"><br>
                    <input type="password" name="password" id="password" placeholder="Password"><br>
                </div>
                <button id="register_btn_register">Register</button><br>
                <a id="login_link_from_register" href="student_login.html">Already have an account? Login</a><br>
            </form>
    </div>
</body>
</html>
