<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h2 id="main_heading">Coaching Institute ERP</h2> 
        <h3 id="register_heading">Student Registration</h3>
            <form action="#" class="form">
                <div class="cred">
                    <input type="text" name="name" id="name" placeholder="Full Name" required><br>
                    <input type="tel" name="phone" id="phone" placeholder="Phone No."><br>
                    <input type="email" name="email" id="email" placeholder="Email"><br>
                     <input type="password" id="password" name="password" placeholder="Create Password"
                                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}"
                         title="Password must contain uppercase, lowercase, number, special character and 8+ characters"required>
                     <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required><br>
                      <div class="select-row">
                      <select name="course_id" id="course_id">
                    <option value="" disabled selected>Select Course</option>
                    <option value="1">JEE</option>
                    <option value="2">NEET</option>
                    <option value="3">Foundation</option>
                    </select>                     
                    <select name="batch_id" id="batch_id">
                    <option value="" disabled selected>Select Batch</option>
                    <option value="1">Batch A</option>
                    <option value="2">Batch B</option>
                </select>
                    </div>
                 <input type="date" name="admission_date" id="admission_date"><br>
                </div>
                <button id="register_btn_register">Register</button><br>
                <a id="login_link_from_register" href="student_login.html">Already have an account? Login</a><br>
            </form>
    </div>
</body>
</html>
