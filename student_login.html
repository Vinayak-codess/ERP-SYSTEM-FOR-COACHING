<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function generateCaptcha() {
            var captcha = Math.floor(1000 + Math.random() * 9000);
            document.getElementById("showCaptcha").innerText = captcha;
            document.getElementById("realCaptcha").value = captcha;
        }

        function checkCaptcha() {
            var real = document.getElementById("realCaptcha").value;
            var user = document.getElementById("userCaptcha").value;

            if (real != user) {
                alert("Wrong Captcha");
                generateCaptcha();
                document.getElementById("userCaptcha").value = "";
                return false;
            }

            return true;
        }
    </script>
</head>
<body onload="generateCaptcha()">
    <div class="main">
        <h2 id="main_heading">Coaching Institute ERP</h2> 
        <h3 id="login_heading">Student Login</h3>
        <form action="student_login.php" method="post" class="form" onsubmit="return checkCaptcha();">

                <div class="cred">
                <input type="tel" name="phone" id="phone" placeholder="Phone No."><br>
                <input type="password" name="password" id="password" placeholder="Password"><br>
                </div>
            
            <div class="captcha-box">
                <h3 class="captcha-title">Enter Captcha</h3>
                <h1 id="showCaptcha"></h1>
                <input type="text" name="userCaptcha" id="userCaptcha" placeholder="Enter Captcha" required>
                <input type="hidden" name="realCaptcha" id="realCaptcha">
            </div>
                <button id="login">Login</button><br>
                <button id="forgot_pass">Forgot Password</button>
                <a id="register_btn_login" href="student_register.html">Not registered? create an account</a><br>
            </form>
            <a id="teacher_login_link" href="teacher_login.html">Teacher Login</a>
    </div>
</body>
</html>
